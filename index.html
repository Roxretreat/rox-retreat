
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROX RETREAT</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f3ef;
      color: #2c2c2c;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }
    header img {
      height: 60px;
      border-radius: 10px;
    }
    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #4b4b4b;
      font-weight: 500;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #b4975a;
    }
    .hero {
      background: linear-gradient(to right, #fdfbf9, #f5f3ef);
      text-align: center;
      padding: 4rem 2rem;
    }
    .hero h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #2c2c2c;
    }
    .hero p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 auto;
      color: #555;
    }
    .booking {
      background-color: #ffffff;
      padding: 3rem 2rem;
      max-width: 600px;
      margin: 2rem auto;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
    .booking h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #2c2c2c;
    }
    .booking label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .booking input[type="date"] {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    .booking button {
      width: 100%;
      padding: 0.75rem;
      background-color: #b4975a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .booking button:hover {
      background-color: #a1874f;
    }
    footer {
      background-color: #ffffff;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #888;
      border-top: 1px solid #e0e0e0;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <img src="165x165_PinterestProfile.jpg" alt="ROX RETREAT Logo" />
    <nav>
      <a href="#home">Home</a>
      <a href="#accommodations">Accommodations</a>
      <a href="#gallery">Gallery</a>
      <a href="#booking">Booking</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h1>Welcome to ROX RETREAT</h1>
    <p>Your private escape in Los Baños with its own natural hot spring swimming pool. Discover peace, luxury, and nature all in one place.</p>
  </section>

  <section class="booking" id="booking">
    <h2>Booking and Reservations</h2>
    <form>
      <label for="checkin">Check-In Date</label>
      <input type="date" id="checkin" name="checkin" required>
      
      <label for="checkout">Check-Out Date</label>
      <input type="date" id="checkout" name="checkout" required>
      
      <button type="submit">Book Now</button>
    </form>
  </section>

  <footer>
    &copy; 2025 ROX RETREAT, Lakewood Estate, Los Baños, Philippines
  </footer>

</body>
</html>
